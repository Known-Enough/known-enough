name: Drain one exact owned never-dispatched disabled job
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      package_source:
        required: true
        type: string
      owned_source:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: known-enough-lifecycle-installation
  cancel-in-progress: false
jobs:
  drain:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && github.actor_id == '143764700'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      PACKAGE_SOURCE: ${{ inputs.package_source }}
      OWNED_SOURCE: ${{ inputs.owned_source }}
      AWS_MAX_ATTEMPTS: '1'
      NODE_NO_WARNINGS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify checked source and drain only never-dispatched owned state
        run: |
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node scripts/operations/verify.mjs > /dev/null
          git diff --exit-code "$PACKAGE_SOURCE" -- apps packages
          npm ci
          node --experimental-transform-types --test scripts/operations/jobs-precall-drain.test.mjs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobOperations
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Read exact disabled control and zero-attempt delivery privately
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/jobs-precall-drain.mjs read
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubQaRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Recover at most eight private own-model proof objects and verify exact source
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/jobs-precall-drain.mjs recover
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobOperations
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Terminate only the exact disabled zero-attempt job without a provider port
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/jobs-precall-drain.mjs drain
      - name: Publish only finite drain results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-jobs-precall-drain
          path: ${{ runner.temp }}/precall-drain-*-report.json
          if-no-files-found: warn
          retention-days: 30
