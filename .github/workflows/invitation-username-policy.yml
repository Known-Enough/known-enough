name: Repair scoped invitation username permission
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact checked main source
        required: true
        type: string
      inspect_only:
        description: Read installed permission only; no policy update
        required: false
        type: boolean
        default: true
      run_checks:
        description: Run isolated policy-change tests
        required: false
        type: boolean
        default: true
      recipient_username_sha256:
        description: Optional normalized username SHA256 for private read-only consistency inspection
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: known-enough-lifecycle-installation
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - name: Run isolated policy-change tests
        if: inputs.run_checks
        run: |
          python3 -B scripts/operations/invitation-username-policy.test.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Inspect installed username permission without modifying it
        if: inputs.inspect_only
        env:
          INVITATION_POLICY_PHASE: inspect
        run: python3 -B scripts/operations/invitation-username-policy.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: inputs.inspect_only && inputs.recipient_username_sha256 != ''
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPartitionMigration
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Inspect recipient identity and private username directory without changing data
        if: inputs.inspect_only && inputs.recipient_username_sha256 != ''
        env:
          RECIPIENT_USERNAME_SHA256: ${{ inputs.recipient_username_sha256 }}
        run: python3 -B scripts/operations/invitation-recipient-inspect.py
      - name: Prepare exact scoped candidate from the read-only inspector role
        id: prepare
        if: '!inputs.inspect_only'
        run: |
          umask 077
          INVITATION_POLICY_PHASE=prepare python3 -B scripts/operations/invitation-username-policy.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: steps.prepare.outcome == 'success'
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobOperations
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Submit the single narrowly scoped policy update
        id: apply
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          INVITATION_POLICY_PHASE: apply
        run: python3 -B scripts/operations/invitation-username-policy.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: always() && steps.prepare.outcome == 'success'
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Read back exact USERNAME permissions independently
        if: always() && steps.prepare.outcome == 'success'
        env:
          INVITATION_POLICY_PHASE: readback
        run: python3 -B scripts/operations/invitation-username-policy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: invitation-username-policy
          path: ${{ runner.temp }}/invitation-username-policy-*.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.inspect_only && inputs.recipient_username_sha256 != ''
        with:
          name: invitation-recipient-inspect
          path: ${{ runner.temp }}/invitation-recipient-inspect.json
          if-no-files-found: warn
          retention-days: 30
