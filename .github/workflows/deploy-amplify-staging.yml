name: Deploy Known Enough staging to AWS Amplify

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/check-bundle.mjs'
      - '.github/workflows/deploy-amplify-staging.yml'
  workflow_dispatch:

concurrency:
  group: known-enough-amplify-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main'
    env:
      AWS_REGION: us-east-1
      AMPLIFY_APP_ID: d143q5ravxp5av
      AMPLIFY_BRANCH: main
      VITE_COGNITO_REGION: us-east-1
      VITE_COGNITO_USER_POOL_ID: us-east-1_V9OMjd0zx
      VITE_COGNITO_DOMAIN: https://known-enough-092954139775.auth.us-east-1.amazoncognito.com
      VITE_COGNITO_PARTICIPANT_CLIENT_ID: 3accf7paalvon2m8ue8okfi853
      VITE_COGNITO_DISPLAY_CLIENT_ID: 481ru24906sv26f30i569gq8g0
      VITE_API_BASE_URL: https://u94iyvt6p9.execute-api.us-east-1.amazonaws.com
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the public web artifact
        run: |
          npm ci
          npm run build
          test -s apps/web/dist/index.html
          cd apps/web/dist
          zip -qr "$GITHUB_WORKSPACE/amplify-build.zip" .

      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughAmplifyMainDeploy
          aws-region: us-east-1
          role-session-name: known-enough-main-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true

      - name: Upload and publish the build
        shell: bash
        run: |
          set -euo pipefail
          response="$(aws amplify create-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --region "$AWS_REGION" \
            --output json --no-cli-pager)"
          job_id="$(jq -r '.jobId' <<< "$response")"
          upload_url="$(jq -r '.zipUploadUrl' <<< "$response")"
          test -n "$job_id"
          test -n "$upload_url"
          curl --fail --silent --show-error --upload-file "$GITHUB_WORKSPACE/amplify-build.zip" "$upload_url"
          aws amplify start-deployment \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name "$AMPLIFY_BRANCH" \
            --job-id "$job_id" \
            --region "$AWS_REGION" \
            --no-cli-pager >/dev/null
          echo "Started Amplify deployment job $job_id"
          for attempt in $(seq 1 60); do
            status="$(aws amplify get-job \
              --app-id "$AMPLIFY_APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$job_id" \
              --region "$AWS_REGION" \
              --query 'job.summary.status' --output text --no-cli-pager)"
            case "$status" in
              SUCCEED|SUCCEEDED) echo "Amplify deployment succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "Amplify deployment ended with $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Amplify deployment did not finish within 10 minutes"
          exit 1
