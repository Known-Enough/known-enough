name: Deploy Known Enough staging to AWS Amplify

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'scripts/live-qa/**'
      - 'tests/live/qa/**'
      - 'infra/live-qa/**'
      - 'playwright.live-qa.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.*'
      - '.github/workflows/live-qa-release-and-check.yml'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/check-bundle.mjs'
      - '.github/workflows/deploy-amplify-staging.yml'
      - 'scripts/zz/**'
      - 'infra/zz/application-config.json'
      - 'infra/permissions/ke13-amplify-github-deploy.json'
  workflow_dispatch:

concurrency:
  group: known-enough-primary-frontend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    env:
      AWS_REGION: us-east-1
      AMPLIFY_APP_ID: d143q5ravxp5av
      AMPLIFY_BRANCH: main
      VITE_COGNITO_REGION: us-east-1
      VITE_COGNITO_USER_POOL_ID: us-east-1_V9OMjd0zx
      VITE_COGNITO_DOMAIN: https://known-enough-092954139775.auth.us-east-1.amazoncognito.com
      VITE_COGNITO_PARTICIPANT_CLIENT_ID: 3accf7paalvon2m8ue8okfi853
      VITE_COGNITO_DISPLAY_CLIENT_ID: 481ru24906sv26f30i569gq8g0
      VITE_API_BASE_URL: https://u94iyvt6p9.execute-api.us-east-1.amazonaws.com
      AWS_MAX_ATTEMPTS: '1'
      EXPECTED_SOURCE: ${{ github.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the public web artifact
        run: |
          npm ci
          npm run build
          test -s apps/web/dist/index.html
          python3 -B scripts/zz/frontend-release.test.py
          python3 -B scripts/zz/post-confirmation-setup.test.py
          python3 -B scripts/zz/install-application-config.test.py

      - name: Get application configuration access
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubApplicationConfig
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          role-duration-seconds: 900
          retry-max-attempts: 1
          unset-current-credentials: true

      - name: Reconcile and verify application configuration before publication
        run: python3 -B scripts/zz/post-confirmation-setup.py --apply --backup-to-s3

      - name: Get short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughAmplifyMainDeploy
          aws-region: us-east-1
          role-session-name: known-enough-main-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true

      - name: Upload and publish the build
        run: python3 -B scripts/zz/frontend-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: application-publication
          path: |
            ${{ runner.temp }}/zz02-setup-report.json
            ${{ runner.temp }}/zz-frontend-release.json
          if-no-files-found: warn
          retention-days: 30
