name: ZZ02 fixed intake and profile setup inspection
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      apply_setup:
        type: boolean
        default: false
      api_sha256:
        type: string
      run_checks:
        description: Run regression tests; false permits user-directed diagnosis without tests
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: known-enough-primary-frontend
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - name: Regression checks
        if: inputs.run_checks
        run: |
          python3 -B scripts/zz/post-confirmation-setup.test.py
          python3 -B scripts/zz/install-application-config.test.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ inputs.apply_setup && 'arn:aws:iam::092954139775:role/KnownEnoughGithubApplicationConfig' || 'arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector' }}
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Fixed metadata and explicitly requested guarded setup
        env:
          APPLY_SETUP: ${{ inputs.apply_setup }}
          CHECKED_API_HASH: ${{ inputs.api_sha256 }}
        run: |
          if [ "$APPLY_SETUP" = true ]; then
            if [ -n "$CHECKED_API_HASH" ]; then
              python3 -B scripts/zz/post-confirmation-setup.py --apply --backup-to-s3 --api-sha256 "$CHECKED_API_HASH"
            else
              python3 -B scripts/zz/post-confirmation-setup.py --apply --backup-to-s3
            fi
          else
            python3 -B scripts/zz/post-confirmation-setup.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zz02-setup-inspection
          path: ${{ runner.temp }}/zz02-setup-report.json
          if-no-files-found: warn
          retention-days: 30
