name: ZZ02 fixed intake and profile setup inspection
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      apply_setup:
        type: boolean
        default: false
      api_sha256:
        type: string
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && github.actor_id == '143764700'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact source and no-write checks
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 -B scripts/zz/post-confirmation-setup.test.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Fixed metadata and explicitly requested guarded setup
        env:
          APPLY_SETUP: ${{ inputs.apply_setup }}
          CHECKED_API_HASH: ${{ inputs.api_sha256 }}
        run: |
          if [ "$APPLY_SETUP" = true ]; then
            python3 -B scripts/zz/post-confirmation-setup.py --apply --api-sha256 "$CHECKED_API_HASH"
          else
            python3 -B scripts/zz/post-confirmation-setup.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zz02-setup-inspection
          path: ${{ runner.temp }}/zz02-setup-report.json
          if-no-files-found: warn
          retention-days: 30
