name: Verify real owner export consent and synthetic erasure
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact checked main source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: known-enough-partition-cutover
  cancel-in-progress: false
jobs:
  cutover:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      NODE_NO_WARNINGS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify exact source and conditional migration/release behaviors before credentials
        run: |
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node scripts/operations/verify.mjs > /dev/null
          npm ci
          npm ci --prefix scripts/live-qa
          node --experimental-transform-types --test scripts/operations/partition-live-behavior.test.mjs scripts/operations/lifecycle-owned-behavior.test.mjs
          npx playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPrimaryRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-backup-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded backup with owned synthetic data
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/partition-backup.mjs  > "$RUNNER_TEMP/partition-backup-behavior-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPartitionMigration
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-recover-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded recover with owned synthetic data
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/partition-cutover.mjs recover > "$RUNNER_TEMP/partition-recover-behavior-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubQaRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-fixtures-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded fixtures with owned synthetic data
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/partition-live-behavior.mjs fixtures > "$RUNNER_TEMP/partition-fixtures-behavior-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPartitionMigration
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: owner-approve-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute owned approve; finite report only
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/lifecycle-owned-behavior.mjs approve > "$RUNNER_TEMP/owner-approve-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubRetentionPolicy
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: owner-policy-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute owned policy; finite report only
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/lifecycle-owned-behavior.mjs policy > "$RUNNER_TEMP/owner-policy-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubLifecycleExecutor
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: owner-execute-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute owned execute; finite report only
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/lifecycle-owned-behavior.mjs execute > "$RUNNER_TEMP/owner-execute-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: always()
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubRetentionPolicy
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: owner-disable-policy-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute owned disable-policy; finite report only
        if: always()
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          if [ -f "$RUNNER_TEMP/partition-cutover-private/owner-proof-private.json" ]; then
            node --experimental-transform-types scripts/operations/lifecycle-owned-behavior.mjs disable-policy > "$RUNNER_TEMP/owner-disable-policy-report.json" 2>&1
          else
            printf '%s\n' '{"result":"POLICY_NOT_STARTED"}' > "$RUNNER_TEMP/owner-disable-policy-report.json"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: always()
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPartitionMigration
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-disable-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded disable with owned synthetic data
        if: always()
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/partition-live-behavior.mjs disable > "$RUNNER_TEMP/partition-disable-behavior-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: always()
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubQaRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-cleanup-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded cleanup with owned synthetic data
        if: always()
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/partition-live-behavior.mjs cleanup > "$RUNNER_TEMP/partition-cleanup-behavior-report.json" 2>&1
      - name: Publish only finite behavior and cleanup results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-lifecycle-behavior
          path: |
            ${{ runner.temp }}/partition-*-behavior-report.json
            ${{ runner.temp }}/owner-*-report.json
          if-no-files-found: warn
          retention-days: 30
