name: Read installed OPS03 consent permissions
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: known-enough-lifecycle-installation
  cancel-in-progress: false
jobs:
  recovery:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && github.actor_id == '143764700'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_MAX_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact source and consent metadata bounds
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 -B scripts/operations/jobs-consent-access-readback.test.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Generate checked exact policy comparison privately
        run: |
          node --input-type=module - <<'JS'
          import { accessTemplate } from './scripts/operations/access-setup.mjs';
          import { writeFileSync } from 'node:fs';
          const r = accessTemplate().Resources;
          writeFileSync(process.env.RUNNER_TEMP + '/consent-policy-expected.json', JSON.stringify({inline:r.JobsRole.Properties.Policies[0].PolicyDocument,boundary:r.JobsBoundary.Properties.PolicyDocument}), {mode:0o600});
          JS
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Read exact role inline policy and current boundary; no data mutations
        run: python3 -B scripts/operations/jobs-consent-access-readback.py
      - name: Publish finite recovery outcome only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-jobs-consent-access-readback
          path: ${{ runner.temp }}/consent-policy-readback-report.json
          if-no-files-found: warn
          retention-days: 30
