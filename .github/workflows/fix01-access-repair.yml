name: FIX01 exact public draft permission repair
on:
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: known-enough-lifecycle-installation
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && github.actor_id == '143764700'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      AWS_MAX_ATTEMPTS: '1'
      AWS_RETRY_MODE: standard
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify checked source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobOperations
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - run: python3 -B scripts/fix01/install-public-draft-access.py --apply > "$RUNNER_TEMP/fix01-access-repair-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: fix01-access-repair, path: '${{ runner.temp }}/fix01-access-repair-report.json', if-no-files-found: warn}
