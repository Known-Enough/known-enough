name: Prepare or publish coordinated background job packages
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact checked main source SHA
        required: true
        type: string
      publish_api:
        description: Publish authenticated enqueue API and rebind only empty disabled control
        type: boolean
        default: false
      previous_job_source:
        description: Exact observed current disabled control source
        type: string
        default: 62c1f648c9bbcbb3a8279f817821c9130d4aae50
permissions:
  contents: read
concurrency:
  group: known-enough-lifecycle-installation
  cancel-in-progress: false
jobs:
  cutover:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      NODE_NO_WARNINGS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify checked source and owner package/release guards before credentials
        run: |
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node scripts/operations/verify.mjs > /dev/null
          npm ci
          python3 -B scripts/operations/jobs-worker-release.test.py
          node --experimental-transform-types --test scripts/operations/partition-transfer.test.mjs scripts/operations/partition-backup.test.mjs scripts/operations/partition-cutover.test.mjs scripts/operations/lifecycle-release.test.mjs scripts/operations/lifecycle-package.test.mjs scripts/operations/jobs-api-release.test.mjs scripts/operations/jobs-source-transition.test.mjs scripts/operations/jobs-runtime-package.test.mjs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPrimaryRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-backup-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded private backup and publish only finite status
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/partition-backup.mjs  > "$RUNNER_TEMP/partition-backup-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPartitionMigration
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-prepare-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded private prepare and publish only finite status
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/jobs-api-release.mjs > "$RUNNER_TEMP/partition-prepare-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubQaRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-upload-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded private upload and publish only finite status
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/partition-cutover.mjs upload > "$RUNNER_TEMP/partition-upload-report.json" 2>&1
      - name: Store only the source-matching private worker archive
        run: |
          umask 077
          python3 -B - <<'PYCODE'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          report = json.loads((root/'partition-prepare-report.json').read_text())
          w = report['worker']
          p = root/'model-job-runtime-private/model-worker.zip'
          assert w['sourceSha'] == os.environ['GITHUB_SHA']
          assert hashlib.sha256(p.read_bytes()).hexdigest() == w['sha256']
          result = subprocess.run(['aws','s3api','put-object','--bucket','known-enough-qa-artifacts-092954139775','--key',w['workerKey'],'--body',str(p),'--server-side-encryption','AES256','--if-none-match','*','--no-cli-pager'], capture_output=True, text=True)
          if result.returncode:
              if '(PreconditionFailed)' not in result.stderr:
                  raise SystemExit('COORDINATED_WORKER_UPLOAD_UNVERIFIED')
              saved = root/'existing-coordinated-worker-private.zip'
              existing = subprocess.run(['aws','s3api','get-object','--bucket','known-enough-qa-artifacts-092954139775','--key',w['workerKey'],str(saved),'--no-cli-pager'], capture_output=True, text=True)
              if existing.returncode or hashlib.sha256(saved.read_bytes()).hexdigest() != w['sha256']:
                  raise SystemExit('COORDINATED_WORKER_UPLOAD_UNVERIFIED')
          w['artifactStorage'] = 'VERIFIED'
          (root/'partition-prepare-report.json').write_text(json.dumps(report)+'\n')
          PYCODE
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: inputs.publish_api
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: coordinated-worker-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Publish exact matching worker code while schedule remains disabled
        if: inputs.publish_api
        env:
          AWS_MAX_ATTEMPTS: '1'
        run: python3 -B scripts/operations/jobs-worker-release.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: inputs.publish_api
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPrimaryRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-publish-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Execute bounded private publish and publish only finite status
        if: inputs.publish_api
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/lifecycle-release.mjs publish > "$RUNNER_TEMP/partition-publish-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: inputs.publish_api
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobOperations
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: jobs-disabled-source-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Rebind only disabled empty job control; no activation or provider calls
        if: inputs.publish_api
        env:
          PREVIOUS_JOB_SOURCE: ${{ inputs.previous_job_source }}
        run: |
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node --experimental-transform-types scripts/operations/jobs-source-transition.mjs > "$RUNNER_TEMP/partition-job-source-report.json" 2>&1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: coordinated-jobs-logging-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Verify current provider logging without a model call
        run: python3 -B scripts/operations/jobs-logging-readback.py
      - name: Publish only completed or failed finite phase reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-coordinated-jobs-packages
          path: |
            ${{ runner.temp }}/partition-*-report.json
            ${{ runner.temp }}/model-job-logging-report.json
            ${{ runner.temp }}/model-job-runtime-private/runtime-template.json
          if-no-files-found: warn
          retention-days: 30
