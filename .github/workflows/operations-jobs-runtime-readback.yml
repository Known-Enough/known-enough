name: Verify installed disabled model worker
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact checked main source SHA
        required: true
        type: string
      worker_sha256:
        description: Independently published current worker hash
        required: true
        type: string
      runtime_source_sha:
        description: Source SHA of that independently published worker
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: known-enough-lifecycle-installation
  cancel-in-progress: false
jobs:
  readback:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_MAX_ATTEMPTS: 1
      AWS_RETRY_MODE: standard
      EXPECTED_WORKER_SHA256: ${{ inputs.worker_sha256 }}
      EXPECTED_WORKER_SOURCE: ${{ inputs.runtime_source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check exact source before credentials
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 -B scripts/operations/jobs-runtime-readback.test.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: model-job-readback-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Read exact installed configuration disabled rule and private artifact hash
        run: python3 -B scripts/operations/jobs-runtime-readback.py
      - name: Publish finite readback only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-jobs-runtime-readback
          path: ${{ runner.temp }}/jobs-runtime-readback.json
          if-no-files-found: warn
          retention-days: 30
