name: Inspect live group cutover configuration
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact checked main source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: known-enough-partition-cutover
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify exact source and private configuration boundary
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node scripts/operations/verify.mjs > /dev/null
          npm ci
          node --experimental-transform-types --test scripts/operations/partition-release-preflight.test.mjs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: partition-preflight-${{ github.run_id }}
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
      - name: Read fixed primary configuration privately
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          NODE_NO_WARNINGS=1 node --experimental-transform-types scripts/operations/partition-release-preflight.mjs \
            > "$RUNNER_TEMP/partition-preflight-report.json" 2>&1
      - name: Record checks that could not start
        if: always()
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'partition-preflight-report.json'
          if not target.exists() or target.stat().st_size == 0:
              target.write_text(json.dumps({'sourceSha': os.environ['GITHUB_SHA'], 'result': 'NOT_EXECUTED', 'deployment': 'NOT_EXECUTED', 'activation': 'NOT_EXECUTED'}) + '\n')
          PY
      - name: Publish only readiness booleans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-partition-preflight
          path: ${{ runner.temp }}/partition-preflight-report.json
          if-no-files-found: warn
          retention-days: 30
