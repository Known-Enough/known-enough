name: FIX01 verified public draft model control
on:
  workflow_dispatch:
    inputs:
      source_sha: {type: string, required: true}
      api_sha256: {type: string, required: true}
      worker_sha256: {type: string, required: true}
      enable: {type: boolean, default: true}
permissions: {contents: read}
concurrency: {group: known-enough-lifecycle-installation, cancel-in-progress: false}
jobs:
  setup:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && github.actor_id == '143764700'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, id-token: write}
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      API_SHA256: ${{ inputs.api_sha256 }}
      WORKER_SHA256: ${{ inputs.worker_sha256 }}
      ENABLE: ${{ inputs.enable }}
      AWS_MAX_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubPrimaryRelease
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - run: python3 -B scripts/fix01/enable.py api --api-sha256 "$API_SHA256"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobRelease
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - run: python3 -B scripts/fix01/enable.py worker --worker-sha256 "$WORKER_SHA256"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubQaRelease
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - run: python3 -B scripts/fix01/enable.py logging
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobOperations
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - run: |
          if [ "$ENABLE" = true ]; then
            python3 -B scripts/fix01/enable.py enable
          else
            python3 -B scripts/fix01/enable.py disable
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: fix01-control, path: '${{ runner.temp }}/fix01-*-guard.json', if-no-files-found: warn}
