name: Read operations installation prerequisites
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact checked main source SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: known-enough-operations-intake
  cancel-in-progress: false
jobs:
  readback:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && github.actor_id == '143764700'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify fixed source and setup before credentials
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node scripts/operations/verify.mjs > /dev/null
          node --test scripts/operations/installed-readback.test.mjs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector
          aws-region: us-east-1
          role-duration-seconds: 900
          role-session-name: operations-intake-${{ github.run_id }}
          allowed-account-ids: '092954139775'
      - name: Read only fixed installation metadata
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          umask 077
          export CHECKOUT_SOURCE="$(git rev-parse HEAD)"
          node scripts/operations/installed-readback.mjs > "$RUNNER_TEMP/operations-intake.json"
      - name: Publish only the allowlisted readback and denial codes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-intake-result
          path: ${{ runner.temp }}/operations-intake.json
          if-no-files-found: warn
          retention-days: 30
