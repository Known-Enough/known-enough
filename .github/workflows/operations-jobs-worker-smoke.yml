name: Verify installed empty job worker execution
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      package_source:
        required: true
        type: string
      worker_sha:
        required: true
        type: string
      schedule_operation:
        description: Bounded smoke or activate the existing worker after a verified empty tick
        type: choice
        default: smoke
        options: [smoke, activate, deactivate]
permissions:
  contents: read
concurrency:
  group: known-enough-lifecycle-installation
  cancel-in-progress: false
jobs:
  smoke:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PACKAGE_SOURCE: ${{ inputs.package_source }}
      WORKER_SHA: ${{ inputs.worker_sha }}
      SCHEDULE_OPERATION: ${{ inputs.schedule_operation }}
      AWS_MAX_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check source and smoke privacy boundaries
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 -B scripts/operations/jobs-worker-smoke.test.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobOperations
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Verify empty disabled matching control
        env:
          SMOKE_PHASE: control
        run: python3 -B scripts/operations/jobs-worker-smoke.py
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        if: inputs.schedule_operation == 'activate'
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubStagingInspector
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Verify provider logging disabled before activation
        if: inputs.schedule_operation == 'activate'
        env:
          EXPECTED_SOURCE: ${{ inputs.package_source }}
        run: python3 -B scripts/fix01/enable.py logging
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubModelJobRelease
          aws-region: us-east-1
          role-duration-seconds: 900
          allowed-account-ids: '092954139775'
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Observe bounded empty worker tick and apply selected schedule operation
        env:
          SMOKE_PHASE: schedule
        run: python3 -B scripts/operations/jobs-worker-smoke.py
      - name: Disable schedule unless guarded activation passed
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/worker-smoke-control.json"; then
            if [ "$SCHEDULE_OPERATION" = activate ] && python3 -c 'import json,os; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"worker-smoke-schedule-report.json"; assert json.loads(p.read_text()).get("result")=="WORKER_SCHEDULE_ACTIVATION_PASS"'; then
              exit 0
            fi
            aws events disable-rule --name KnownEnoughModelJobs --region us-east-1 --no-cli-pager
          fi
      - name: Publish finite smoke results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operations-jobs-worker-smoke
          path: ${{ runner.temp }}/worker-smoke-*-report.json
          if-no-files-found: warn
          retention-days: 30
