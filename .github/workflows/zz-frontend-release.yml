name: ZZ primary frontend publication
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      entry_only:
        description: Hide shared-screen entry on the verified live frontend without unpublished dashboard changes
        type: boolean
        default: false
      run_checks:
        description: Run regression tests; false preserves source/build guards for user-directed publication
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: known-enough-primary-frontend
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Known-Enough/known-enough' && github.ref == 'refs/heads/main' && (github.actor_id == '143764700' || github.actor_id == '44531296')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_MAX_ATTEMPTS: 1
      AWS_RETRY_MODE: standard
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      VITE_COGNITO_REGION: us-east-1
      VITE_COGNITO_USER_POOL_ID: us-east-1_V9OMjd0zx
      VITE_COGNITO_DOMAIN: https://known-enough-092954139775.auth.us-east-1.amazoncognito.com
      VITE_COGNITO_PARTICIPANT_CLIENT_ID: 3accf7paalvon2m8ue8okfi853
      VITE_COGNITO_DISPLAY_CLIENT_ID: 481ru24906sv26f30i569gq8g0
      VITE_API_BASE_URL: https://u94iyvt6p9.execute-api.us-east-1.amazonaws.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify exact source before credentials
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - name: Regression checks
        if: inputs.run_checks
        run: |
          python3 -B scripts/zz/frontend-release.test.py
          python3 -B scripts/zz/entry-only-build.test.py
          python3 -B scripts/zz/post-confirmation-setup.test.py
          python3 -B scripts/zz/install-application-config.test.py
      - name: Build public frontend
        run: |
          npm ci
          npm run build
      - name: Prepare only the verified live entry change
        if: inputs.entry_only
        run: |
          npx playwright install --with-deps chromium
          python3 -B scripts/zz/entry-only-build.py
      - name: Application configuration access
        if: ${{ !inputs.entry_only }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubApplicationConfig
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          role-duration-seconds: 900
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Reconcile and verify declared application configuration before publication
        if: ${{ !inputs.entry_only }}
        run: python3 -B scripts/zz/post-confirmation-setup.py --apply --backup-to-s3
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughAmplifyMainDeploy
          aws-region: us-east-1
          allowed-account-ids: '092954139775'
          role-duration-seconds: 900
          retry-max-attempts: 1
          unset-current-credentials: true
      - name: Publish only primary frontend and verify completion
        env:
          ENTRY_ONLY: ${{ inputs.entry_only }}
        run: |
          if [ "$ENTRY_ONLY" = true ]; then
            python3 -B scripts/zz/entry-only-build.py verify-live
          fi
          python3 -B scripts/zz/frontend-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zz-frontend-release
          path: |
            ${{ runner.temp }}/zz-frontend-release.json
            ${{ runner.temp }}/zz-entry-only-build.json
            ${{ runner.temp }}/zz02-setup-report.json
          if-no-files-found: warn
          retention-days: 30
