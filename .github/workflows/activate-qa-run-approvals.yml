name: Activate GitHub QA run approvals
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: known-enough-isolated-qa-release-and-test
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify A's main dispatch before obtaining AWS access
        run: |
          node --input-type=module -e "import {approvalContext} from './scripts/live-qa/github-allowance.mjs'; approvalContext({repository:process.env.GITHUB_REPOSITORY,repositoryId:process.env.GITHUB_REPOSITORY_ID,ref:process.env.GITHUB_REF,event:process.env.GITHUB_EVENT_NAME,actor:process.env.GITHUB_ACTOR,actorId:process.env.GITHUB_ACTOR_ID,triggeringActor:process.env.GITHUB_TRIGGERING_ACTOR});"
      - name: Check pinned source and build the broker package
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          npm ci
          npm ci --prefix scripts/live-qa --ignore-scripts
          npx playwright install --with-deps chromium
          npm run check
          umask 077
          mkdir -p /tmp/qa-run-approvals
          node scripts/live-qa/package.mjs /tmp/qa-run-approvals "$GITHUB_SHA"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::092954139775:role/KnownEnoughGithubQaRelease
          aws-region: us-east-1
          role-session-name: qa-approvals-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
      - name: Update only the existing broker and read back its code and settings
        run: node scripts/live-qa/activate-run-approvals.mjs /tmp/qa-run-approvals
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qa-run-approval-activation
          path: /tmp/qa-run-approvals/activation.json
          if-no-files-found: ignore
          retention-days: 7
